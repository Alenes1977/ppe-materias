# Pipeline: tests + smoke de arranque → imagen linux/amd64 → comprobar registry.
# Guía: docs/gitlab-registry.md
#
# Sin Docker-in-Docker (bloqueado en el runner UNAV). Kaniko construye y publica.

stages:
  - test
  - build
  - verify

variables:
  IMAGE_TAG: '$CI_COMMIT_SHORT_SHA'

default:
  interruptible: true

test:
  stage: test
  image: node:20-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run typecheck
    - npm run lint
    - npm run format:check
    - npm run build
    - sh scripts/ci-smoke-server.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build_image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: ['']
  needs:
    - test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - sh scripts/ci-build-registry.sh

verify_image:
  stage: verify
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: ['']
  needs:
    - build_image
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - sh scripts/ci-verify-image.sh
